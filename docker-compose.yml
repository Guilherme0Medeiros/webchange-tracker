services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webchange_radar
      POSTGRES_USER: webchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchange -d webchange_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
